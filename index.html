<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phasor Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d1f21; height: 100%; overflow: hidden; touch-action: none; }
  #game { display: flex; justify-content: center; align-items: center; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  const config = {
    type: Phaser.AUTO,
    parent: 'game',
    width: 800,
    height: 600,
    backgroundColor: '#2d2d2d',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: { debug: false }
    },
    scene: { create, update }
  };

  const SPEED = 300;
  let ball;
  let cursors;
  let moveDir = { x: 0, y: 0 };

  window.game = new Phaser.Game(config);

  function create() {
    ball = this.add.circle(400, 300, 20, 0x00ff88);
    this.physics.add.existing(ball);
    ball.body.setCollideWorldBounds(true);

    cursors = this.input.keyboard.createCursorKeys();

    this.input.on('pointerdown', pointer => {
      const dx = pointer.worldX - ball.x;
      const dy = pointer.worldY - ball.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 4) {
        moveDir = { x: dx / dist, y: dy / dist };
      }
    });
  }

  function update() {
    let vx = 0;
    let vy = 0;
    let keyUsed = false;

    if (cursors.left.isDown) { vx = -SPEED; keyUsed = true; }
    else if (cursors.right.isDown) { vx = SPEED; keyUsed = true; }

    if (cursors.up.isDown) { vy = -SPEED; keyUsed = true; }
    else if (cursors.down.isDown) { vy = SPEED; keyUsed = true; }

    if (keyUsed) {
      moveDir = { x: 0, y: 0 };
      ball.body.setVelocity(vx, vy);
    } else {
      ball.body.setVelocity(moveDir.x * SPEED, moveDir.y * SPEED);
    }
  }
</script>
</body>
</html>
