<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phasor Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d1f21; height: 100%; overflow: hidden; touch-action: none; }
  #game { display: flex; justify-content: center; align-items: center; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  const config = {
    type: Phaser.AUTO,
    parent: 'game',
    width: 800,
    height: 600,
    backgroundColor: '#2d2d2d',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: { debug: false }
    },
    scene: { create, update }
  };

  const SPEED = 300;
  let ball;
  let cursors;
  let pointerDown = false;

  window.game = new Phaser.Game(config);

  function create() {
    ball = this.add.circle(400, 300, 20, 0x00ff88);
    this.physics.add.existing(ball);
    ball.body.setCollideWorldBounds(true);

    cursors = this.input.keyboard.createCursorKeys();

    this.input.on('pointerdown', () => { pointerDown = true; });
    this.input.on('pointerup', () => { pointerDown = false; });
  }

  function update() {
    ball.body.setVelocity(0);

    if (cursors.left.isDown) ball.body.setVelocityX(-SPEED);
    else if (cursors.right.isDown) ball.body.setVelocityX(SPEED);

    if (cursors.up.isDown) ball.body.setVelocityY(-SPEED);
    else if (cursors.down.isDown) ball.body.setVelocityY(SPEED);

    if (pointerDown) {
      const pointer = this.input.activePointer;
      const dx = pointer.worldX - ball.x;
      const dy = pointer.worldY - ball.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 4) {
        ball.body.setVelocity((dx / dist) * SPEED, (dy / dist) * SPEED);
      }
    }
  }
</script>
</body>
</html>
