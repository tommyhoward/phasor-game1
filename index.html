<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phasor Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d1f21; display: flex; justify-content: center; align-items: center; height: 100%; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#2d2d2d',
    physics: {
      default: 'arcade',
      arcade: { debug: false }
    },
    scene: { create, update }
  };

  const SPEED = 300;
  let ball;
  let cursors;

  window.game = new Phaser.Game(config);

  function create() {
    ball = this.add.circle(400, 300, 20, 0x00ff88);
    this.physics.add.existing(ball);
    ball.body.setCollideWorldBounds(true);

    cursors = this.input.keyboard.createCursorKeys();
  }

  function update() {
    ball.body.setVelocity(0);

    if (cursors.left.isDown) ball.body.setVelocityX(-SPEED);
    else if (cursors.right.isDown) ball.body.setVelocityX(SPEED);

    if (cursors.up.isDown) ball.body.setVelocityY(-SPEED);
    else if (cursors.down.isDown) ball.body.setVelocityY(SPEED);
  }
</script>
</body>
</html>
