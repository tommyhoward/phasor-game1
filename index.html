<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phasor Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #1d1f21; height: 100%; overflow: hidden; touch-action: none; }
  #game { display: flex; justify-content: center; align-items: center; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
  const config = {
    type: Phaser.AUTO,
    parent: 'game',
    width: 800,
    height: 600,
    backgroundColor: '#2d2d2d',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: { debug: false }
    },
    scene: { create, update }
  };

  const SPEED = 300;
  let ball;
  let cursors;
  const touch = { left: false, right: false, up: false, down: false };

  window.game = new Phaser.Game(config);

  function create() {
    ball = this.add.circle(400, 300, 20, 0x00ff88);
    this.physics.add.existing(ball);
    ball.body.setCollideWorldBounds(true);

    cursors = this.input.keyboard.createCursorKeys();

    createDpad(this);
  }

  function createDpad(scene) {
    const r = 40;
    const gap = 85;
    const cx = 140;
    const cy = 600 - 140;

    makeButton(scene, cx, cy - gap, r, '▲', 'up');
    makeButton(scene, cx, cy + gap, r, '▼', 'down');
    makeButton(scene, cx - gap, cy, r, '◀', 'left');
    makeButton(scene, cx + gap, cy, r, '▶', 'right');
  }

  function makeButton(scene, x, y, r, label, dir) {
    const circle = scene.add.circle(x, y, r, 0xffffff, 0.15)
      .setStrokeStyle(2, 0xffffff, 0.4)
      .setScrollFactor(0)
      .setInteractive();
    scene.add.text(x, y, label, { fontSize: '28px', color: '#ffffff' })
      .setOrigin(0.5)
      .setScrollFactor(0);

    circle.on('pointerdown', () => { touch[dir] = true; });
    circle.on('pointerup', () => { touch[dir] = false; });
    circle.on('pointerout', () => { touch[dir] = false; });
  }

  function update() {
    ball.body.setVelocity(0);

    if (cursors.left.isDown || touch.left) ball.body.setVelocityX(-SPEED);
    else if (cursors.right.isDown || touch.right) ball.body.setVelocityX(SPEED);

    if (cursors.up.isDown || touch.up) ball.body.setVelocityY(-SPEED);
    else if (cursors.down.isDown || touch.down) ball.body.setVelocityY(SPEED);
  }
</script>
</body>
</html>
